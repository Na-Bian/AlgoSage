<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>登录 · AlgoSage</title>
  <link rel="icon" href="/favicon" type="image/svg+xml">
  <link rel="stylesheet" href="/public/auth-page.css">
</head>
<body class="eg-auth-page" data-view="login">
  <main class="auth-left" aria-labelledby="auth-title">
    <a class="auth-brand" href="/login" aria-label="AlgoSage">
      <img src="/public/brand-logo.png" alt="AlgoSage">
    </a>

    <div class="auth-center">
      <div class="auth-panel">
        <h1 class="auth-title" id="auth-title">登录 AlgoSage</h1>

        <form id="login-form" class="auth-view" data-view="login" novalidate>
          <div class="input-field">
            <label for="login-student-id">学号</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
            <input id="login-student-id" name="studentId" type="text" autocomplete="username" spellcheck="false" required>
            </div>
          </div>

          <div class="input-field">
            <label for="login-password">密码</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input id="login-password" name="password" type="password" autocomplete="current-password" required>
              <button type="button" class="eye-button" data-toggle-password="login-password" aria-label="显示密码" aria-pressed="false">
                <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></svg>
              </button>
            </div>
          </div>

          <div id="login-feedback" class="login-feedback" hidden>
            <p id="login-error" class="login-error" role="alert">学号或密码不正确，请重试。</p>
            <a id="forgot-link" class="forgot-link" href="/forgot-password">找回密码</a>
          </div>

          <button id="login-submit" class="primary-button" type="submit">
            <span class="button-label">登录</span>
          </button>

          <p class="auth-switch">
            <span>还没有账号？</span>
            <a href="/register">注册</a>
          </p>
        </form>

        <form id="register-form" class="auth-view" data-view="register" novalidate>
          <div class="input-field">
            <label for="register-nickname">昵称</label>
            <div class="input-shell"><input id="register-nickname" type="text" maxlength="40" autocomplete="nickname" required></div>
          </div>
          <div class="input-field">
            <label for="register-student-id">学号</label>
            <div class="input-shell"><input id="register-student-id" type="text" autocomplete="username" spellcheck="false" required></div>
          </div>
          <div class="input-field">
            <label for="register-password">密码</label>
            <div class="input-shell">
              <input id="register-password" type="password" autocomplete="new-password" minlength="12" required>
              <button type="button" class="eye-button" data-toggle-password="register-password" aria-label="显示密码" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="input-field">
            <label for="register-confirm">确认密码</label>
            <div class="input-shell"><input id="register-confirm" type="password" autocomplete="new-password" minlength="12" required></div>
          </div>
          <div class="input-field">
            <label for="register-code">邮箱验证码</label>
            <div class="code-row">
              <div class="input-shell compact"><input id="register-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div>
              <button id="register-send" class="code-button" type="button">发送验证码</button>
            </div>
          </div>
          <button class="primary-button" type="submit"><span class="button-label">创建账号</span></button>
          <p class="auth-switch"><span>已有账号？</span><a href="/login">直接登录</a></p>
        </form>

        <form id="reset-form" class="auth-view" data-view="reset" novalidate>
          <div class="input-field">
            <label for="reset-student-id">学号</label>
            <div class="input-shell"><input id="reset-student-id" type="text" autocomplete="username" spellcheck="false" required></div>
          </div>
          <div class="input-field">
            <label for="reset-code">邮箱验证码</label>
            <div class="code-row">
              <div class="input-shell compact"><input id="reset-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div>
              <button id="reset-send" class="code-button" type="button">发送验证码</button>
            </div>
          </div>
          <div class="input-field">
            <label for="reset-password">新密码</label>
            <div class="input-shell">
              <input id="reset-password" type="password" autocomplete="new-password" minlength="12" required>
              <button type="button" class="eye-button" data-toggle-password="reset-password" aria-label="显示密码" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="input-field">
            <label for="reset-confirm">确认新密码</label>
            <div class="input-shell"><input id="reset-confirm" type="password" autocomplete="new-password" minlength="12" required></div>
          </div>
          <button class="primary-button" type="submit"><span class="button-label">重置密码</span></button>
          <p class="auth-switch"><span>想起密码了？</span><a href="/login">返回登录</a></p>
        </form>

        <p id="auth-status" class="auth-status" role="status"></p>
      </div>
    </div>
  </main>

  <aside class="auth-brand-panel" aria-hidden="true">
    <div class="brand-orbit" data-orbit="1"></div>
    <div class="brand-orbit" data-orbit="2"></div>
    <div class="brand-glow" data-glow="1"></div>
    <div class="brand-glow" data-glow="2"></div>
    <div class="brand-display">
      <img src="/public/brand-logo.png" alt="">
    </div>
  </aside>

  <script src="/public/auth-page.js?v=20261021-login-refactor"></script>
</body>
</html>
