<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人信息 · AlgoSage</title>
  <link rel="icon" href="/favicon" type="image/svg+xml">
  <link rel="stylesheet" href="/public/custom.css">
  <link rel="stylesheet" href="/public/profile-page.css">
</head>
<body class="eg-profile-page">
  <header class="eg-profile-topbar">
    <a class="brand" href="/"><img class="brand-logo" src="/public/brand-logo.png" alt="AlgoSage · 知衡"></a>
    <nav class="topbar-actions"><a class="ghost-link" href="/">返回对话</a></nav>
  </header>
  <main class="profile-shell">
    <div class="profile-hero">
      <div><h1 class="profile-title">个人信息</h1><p class="profile-subtitle">维护你的 HUST 学号身份。昵称和头像会显示在对话右上角。</p></div>
    </div>
    <section class="profile-card">
      <div class="avatar-zone">
        <div class="avatar-frame" id="avatar-frame">
          <img id="avatar-image" alt="当前头像">
          <span class="avatar-initial" id="avatar-initial">学</span>
        </div>
        <div class="avatar-copy">
          <h2>头像</h2><p>支持 PNG、JPEG 或 WebP。系统会居中裁剪为 256×256，原图最大 5MB。</p>
          <div class="avatar-actions">
            <button id="change-avatar" class="solid-button" type="button">更换头像</button>
            <button id="logout-profile" class="quiet-button" type="button">退出登录</button>
          </div>
          <input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </div>
      </div>
      <form id="profile-form">
        <section class="section">
          <h2 class="section-title">账号身份</h2><p class="section-description">学号和教育邮箱由学校账号绑定，不能修改。</p>
          <div class="field-grid">
            <div class="field"><label for="nickname">昵称</label><input id="nickname" maxlength="40" autocomplete="nickname" required></div>
            <div class="field"><label for="student-id">学号</label><input id="student-id" readonly></div>
            <div class="field field-span"><label for="email">教育邮箱</label><input id="email" readonly></div>
          </div>
        </section>
        <section class="section">
          <h2 class="section-title">修改密码</h2><p class="section-description">不需要改密码时，留空这一部分。</p>
          <div class="field-grid">
            <div class="field"><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password"></div>
            <div class="field"><label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" minlength="12"></div>
            <div class="field field-span"><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12"></div>
          </div>
        </section>
        <p class="profile-status" id="profile-status"></p>
        <div class="form-footer"><button class="save-button" id="save-profile" type="submit">保存修改</button></div>
      </form>
    </section>
  </main>
  <script src="/public/profile-page.js?v=20261021-avatar"></script>
</body>
</html>
