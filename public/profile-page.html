<!doctype html>
<html lang="zh-CN" data-theme-default="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人信息 · AlgoSage</title>
  <link rel="icon" href="/favicon" type="image/svg+xml">
  <script src="/public/theme-transition.js?v=20261022-security-alignment"></script>
  <link rel="stylesheet" href="/public/custom.css?v=20261022-security-alignment">
  <link rel="stylesheet" href="/public/profile-page.css?v=20261022-avatar-crop-7">
  <link rel="stylesheet" href="/public/avatar-crop.css?v=20261022-avatar-crop-7">
</head>
<body class="eg-profile-page">
  <header class="eg-profile-topbar">
    <a class="brand" href="/" aria-label="AlgoSage">
      <img class="brand-logo brand-logo-dark" src="/public/brand-logo.png" alt="">
      <img class="brand-logo brand-logo-light" src="/public/brand-logo-light.png" alt="">
    </a>
    <nav class="topbar-actions"><a class="ghost-link" href="/">返回对话</a></nav>
  </header>

  <main class="profile-shell">
    <h1 class="profile-title">个人信息</h1>
    <section class="profile-card" aria-labelledby="profile-heading">
      <h2 class="visually-hidden" id="profile-heading">个人资料</h2>

      <section class="avatar-zone" aria-labelledby="avatar-title">
        <div class="avatar-frame" id="avatar-frame">
          <img id="avatar-image" alt="当前头像">
          <span class="avatar-initial" id="avatar-initial" aria-hidden="true">学</span>
          <span class="avatar-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L8 6H4v12h16V6h-4l-1.5-2Z"/><circle cx="12" cy="13" r="3.2"/></svg>
          </span>
        </div>
        <div class="avatar-copy">
          <h3 id="avatar-title">头像</h3>
          <p>支持 PNG、JPEG 或 WebP。</p>
          <div class="avatar-actions">
            <button id="change-avatar" class="gradient-button" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 0L7 8m5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
              <span>更换头像</span>
            </button>
          </div>
          <input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </div>
      </section>

      <form id="profile-form" novalidate>
        <section class="section" aria-labelledby="account-title">
          <h3 class="section-title marked" id="account-title">账号信息</h3>
          <div class="field-grid">
            <div class="field">
              <label for="nickname">昵称</label>
              <input id="nickname" name="nickname" maxlength="40" autocomplete="nickname" required>
            </div>
            <div class="field">
              <label for="student-id">学号</label>
              <input id="student-id" readonly tabindex="-1" aria-readonly="true">
            </div>
            <div class="field field-span">
              <label for="email">教育邮箱</label>
              <input id="email" readonly tabindex="-1" aria-readonly="true">
            </div>
          </div>
          <div class="profile-save-row" id="profile-save-row" hidden>
            <button class="gradient-button" id="save-profile" type="submit"><span class="button-label">保存修改</span></button>
          </div>
          <p class="profile-status" id="profile-status" role="status" aria-live="polite"></p>
        </section>

        <a class="security-entry" href="/profile/security">
          <span class="entry-main">
            <span class="section-title marked">账号与安全</span>
            <span class="entry-description">管理修改密码、注销账号等安全设置</span>
          </span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </form>
    </section>
  </main>

  <script src="/public/avatar-crop.js?v=20261022-avatar-crop-7"></script>
  <script src="/public/profile-page.js?v=20261022-avatar-crop-7"></script>
</body>
</html>
